# Konfigurasi Bunglon 🦎
# Dioprek bebas: ./puzzle ui etc/bunglon.conf  (dalam ISO: bunglon settings)

# vnc   = Puzzle tetap headless, tampilan diakses via VNC dari HP/PC lain
# local = nyalakan X server + openbox langsung di layar
DISPLAY_MODE="vnc"

DISPLAY_NUM="99"
VNC_PORT="5900"
VNC_HOST="0.0.0.0"
